<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">On1kS — founder of DivineLabs</title>
  <desc id="desc">Dark violet DivineLabs profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="0.52" stop-color="#171126"/>
      <stop offset="1" stop-color="#09090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <ellipse cx="600" cy="120" rx="420" ry="190" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity="0.2" stroke="#a78bfa" fill="none">
    <path d="M0 70H330L380 20M870 300L930 240H1200"/>
    <path d="M0 250H250L300 300M950 40L990 80H1200"/>
    <circle cx="380" cy="20" r="4" fill="#a78bfa"/>
    <circle cx="930" cy="240" r="4" fill="#a78bfa"/>
  </g>

  <text x="600" y="139" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="4">ON1KS</text>
  <rect x="390" y="165" width="420" height="2" fill="url(#line)"/>
  <text x="600" y="207" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="5">FOUNDER OF DIVINELABS</text>
  <text x="600" y="253" text-anchor="middle" fill="#8f8b99" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" letter-spacing="2">MINECRAFT • APPLICATIONS • DEVELOPER TOOLS</text>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#8b5cf6" stroke-opacity="0.32" stroke-width="1.5"/>
</svg>
