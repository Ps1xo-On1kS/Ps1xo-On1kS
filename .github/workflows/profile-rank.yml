name: Update profile rank

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-rank
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate rank card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=Ps1xo-On1kS&show_icons=true&include_all_commits=true&rank_icon=default&hide_border=true&bg_color=00000000&title_color=38BDF8&text_color=94A3B8&icon_color=0EA5E9&border_radius=12
          path: assets/github-rank.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Refresh trophy card
        shell: bash
        run: |
          tmp_file="$(mktemp)"
          updated=false
          for endpoint in \
            "https://trophy.ryglcloud.net/" \
            "https://github-profile-repo.vercel.app/"
          do
            if curl --fail --location --silent --show-error --retry 3 \
              --get "$endpoint" \
              --data-urlencode "username=Ps1xo-On1kS" \
              --data-urlencode "theme=algolia" \
              --data-urlencode "no-frame=true" \
              --data-urlencode "no-bg=true" \
              --data-urlencode "margin-w=8" \
              --data-urlencode "margin-h=8" \
              --data-urlencode "row=1" \
              --data-urlencode "column=6" \
              --output "$tmp_file" && \
              grep --quiet '<svg' "$tmp_file" && \
              ! grep --ignore-case --quiet '<html' "$tmp_file"
            then
              mv "$tmp_file" assets/github-trophies.svg
              updated=true
              break
            fi
          done
          if [ "$updated" != true ]; then
            rm -f "$tmp_file"
            echo "::warning::Trophy mirrors are unavailable; keeping the last generated card."
          fi

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-rank.svg assets/github-trophies.svg
          git commit -m "chore: refresh profile rank [skip ci]" || exit 0
          git push
